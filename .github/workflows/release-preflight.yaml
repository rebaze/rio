name: Release preflight

# Exercise the release caller/callee contracts without tagging or publishing.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, vX.Y.Z
        required: true
        type: string
  pull_request:
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  # A version that is not vX.Y.Z stops the run before anything is built. A
  # pull request's run has no version and checks none.
  version:
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.version.outputs.number }}
    steps:
      - name: Check the version
        id: version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "version must be vX.Y.Z, not \"$VERSION\"" >&2
            exit 1
          fi
          printf 'number=%s\n' "${VERSION#v}" >> "$GITHUB_OUTPUT"

  validate:
    needs: version
    uses: ./.github/workflows/ci.yaml
    with:
      full_validation: true
    permissions:
      contents: read

  analyze:
    needs: version
    uses: ./.github/workflows/codeql.yaml
    permissions:
      contents: read
      actions: read
      security-events: write


  # The candidate's source SBOM and rio's receipt for it, attested before any
  # tag, so that a release gate can verify both for this exact commit. The
  # subject stands for the commit: its name is
  # git+https://github.com/<repo>@<sha>, its digest the SHA-256 of that name;
  # the signing certificate names the commit itself. rio built from the
  # candidate checks the SBOM with its strict gate; a failing gate fails the
  # job before anything is attested. Only a manual run attests: a pull
  # request's run builds a merge commit.
  sbom:
    needs: version
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1

      - name: Build rio from the candidate
        shell: bash
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ needs.version.outputs.number }}
        run: |
          set -euo pipefail
          go build -trimpath -o "$RUNNER_TEMP/rio" \
            -ldflags "-s -w -X github.com/rebaze/rio/internal/cli.version=$VERSION -X github.com/rebaze/rio/internal/cli.commit=$GITHUB_SHA" ./cmd/rio
          "$RUNNER_TEMP/rio" version

      - name: Generate the source SBOM and check it with rio's gate
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.number }}
        run: |
          set -euo pipefail
          tools/source-sbom.sh "$VERSION" "rio-${GITHUB_SHA}-source.cdx.json" "$RUNNER_TEMP/rio" "rio-${GITHUB_SHA}-receipt.json"

      - name: Name the candidate commit
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          name="git+https://github.com/${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          printf 'name=%s\n' "$name" >> "$GITHUB_OUTPUT"
          printf 'digest=sha256:%s\n' "$(printf '%s' "$name" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Attest the source SBOM for the candidate commit
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.subject.outputs.name }}
          subject-digest: ${{ steps.subject.outputs.digest }}
          sbom-path: rio-${{ github.sha }}-source.cdx.json

      - name: Attest rio's receipt for the candidate commit
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.subject.outputs.name }}
          subject-digest: ${{ steps.subject.outputs.digest }}
          predicate-type: https://rebaze.com/attestation/rio-run-receipt/v1
          predicate-path: rio-${{ github.sha }}-receipt.json
