name: Release preflight

# Exercise the release caller/callee contracts without tagging or publishing.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yaml
    with:
      full_validation: true
    permissions:
      contents: read

  analyze:
    uses: ./.github/workflows/codeql.yaml
    permissions:
      contents: read
      actions: read
      security-events: write


  # The candidate's source SBOM, attested before any tag, so that a release
  # gate can verify it for this exact commit. The subject stands for the
  # commit: its name is git+https://github.com/<repo>@<sha>, its digest the
  # SHA-256 of that name; the signing certificate names the commit itself.
  # Only a manual run attests: a pull request's run builds a merge commit.
  sbom:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1

      - name: Generate source CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          syft dir:. --output "cyclonedx-json@1.6=rio-${GITHUB_SHA}-source.cdx.json"

      - name: Name the candidate commit
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          name="git+https://github.com/${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          printf 'name=%s\n' "$name" >> "$GITHUB_OUTPUT"
          printf 'digest=sha256:%s\n' "$(printf '%s' "$name" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Attest the source SBOM for the candidate commit
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.subject.outputs.name }}
          subject-digest: ${{ steps.subject.outputs.digest }}
          sbom-path: rio-${{ github.sha }}-source.cdx.json
