name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '15 4 * * 3' # Wednesday 04:15 UTC

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Go
    runs-on: ubuntu-latest
    permissions:
      # contents: read is not inherited: a job-level permissions block replaces
      # the workflow-level one outright rather than adding to it. Without it
      # actions/checkout gets a token that cannot read this private repository
      # and fails with "Repository not found".
      contents: read
      # actions: read is required on a private repository: the action reads its
      # own workflow run through the REST API, and without it the analysis
      # completes and then dies on "Resource not accessible by integration".
      actions: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Detect changed file types
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            git cat-file -e "$BASE" 2>/dev/null || git fetch --no-tags --depth=1 origin "$BASE"
            CHANGED=$(git diff --name-only "$BASE...HEAD")
          else
            BASE="${{ github.event.before }}"
            if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE" 2>/dev/null; then
              CHANGED=$(git diff --name-only "$BASE" HEAD)
            else
              CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git ls-files)
            fi
          fi
          echo "Changed files:"
          echo "$CHANGED"
          go=false
          if grep -E '(\.go$|^go\.(mod|sum)$)' <<<"$CHANGED" >/dev/null; then go=true; fi
          if grep -E '^\.github/workflows/codeql\.yaml$' <<<"$CHANGED" >/dev/null; then go=true; fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        if: steps.changes.outputs.go == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Initialize CodeQL
        if: steps.changes.outputs.go == 'true'
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: go

      - name: Autobuild
        if: steps.changes.outputs.go == 'true'
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

      - name: Perform CodeQL analysis
        if: steps.changes.outputs.go == 'true'
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
