name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Only one writer for a tag; a failed run must never replace a release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yaml
    with:
      full_validation: true
    permissions:
      contents: read

  analyze:
    uses: ./.github/workflows/codeql.yaml
    permissions:
      contents: read
      actions: read
      security-events: write

  # Builds, signs and attests the release and leaves it as a verified draft.
  # The Apple signing and notary credentials are secrets of release-build, which
  # only v* tags may deploy to and which no gate holds.
  build:
    needs: [validate, analyze]
    runs-on: ubuntu-latest
    environment: release-build
    permissions:
      contents: write
      id-token: write
      attestations: write
    # The inventory and draft record go to publish as outputs, not artifacts:
    # they are small, and outputs outlast a long wait at the gate.
    outputs:
      inventory: ${{ steps.draft.outputs.inventory }}
      record: ${{ steps.draft.outputs.record }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A re-run must not sign new provenance for a tag that already has a
      # draft or release: the newest provenance would no longer match the draft.
      - name: Refuse a tag that already has a release or draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: python3 tools/release-publish.py vacant --tag "$TAG" --repo "$GITHUB_REPOSITORY"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/security/go.sum

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          install-only: true

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Build, sign and notarize release assets locally (no publication)
        shell: bash
        run: |
          set -euo pipefail
          # GoReleaser skips notarization when the credentials are absent; a
          # release must never fall back to unsigned macOS binaries.
          for name in MACOS_SIGN_P12 MACOS_SIGN_PASSWORD MACOS_NOTARY_KEY MACOS_NOTARY_KEY_ID MACOS_NOTARY_ISSUER_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "missing macOS signing credential: $name" >&2
              exit 1
            fi
          done
          goreleaser release --config .goreleaser.yaml --clean --skip=publish,announce,homebrew
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ vars.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ vars.MACOS_NOTARY_ISSUER_ID }}

      - name: Generate source CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          # The same SBOM release preflight gated, named for the tag; the
          # script leaves GoReleaser's dist/ out with everything that is not rio.
          tools/source-sbom.sh "${GITHUB_REF_NAME#v}" "dist/rio-${GITHUB_REF_NAME}-source.cdx.json"

      - name: Select authored notes for the exact tag
        env:
          TAG: ${{ github.ref_name }}
        run: python3 tools/release-notes.py --tag "$TAG" --notes-dir docs/releases --dist dist

      - name: Stage the exact release assets
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 tools/release-publish.py stage \
            --dist dist --stage release-assets --inventory release-inventory.json \
            --tag "$TAG" --repo "$GITHUB_REPOSITORY"

      # Every asset that can carry provenance does, so each digest is signed
      # where it was built (cleartoship decision 0024). The checksum signature
      # and the attestation bundle are made after it.
      - name: Attest build provenance for the release assets
        id: attest-provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/checksums.txt
            release-assets/rio-${{ github.ref_name }}-source.cdx.json

      - name: Attest source SBOM (CycloneDX) against all archives
        id: attest-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/*.zip
          sbom-path: release-assets/rio-${{ github.ref_name }}-source.cdx.json

      - name: Verify staged assets and upload them as a draft
        id: draft
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PROVENANCE_BUNDLE: ${{ steps.attest-provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.attest-sbom.outputs.bundle-path }}
        run: |
          set -euo pipefail
          for bundle in "$PROVENANCE_BUNDLE" "$SBOM_BUNDLE"; do
            if [[ ! -s "$bundle" ]]; then
              echo "attestation bundle missing or empty: ${bundle:-<unset>}" >&2
              exit 1
            fi
          done
          # Keep the assembled bundle outside the frozen staging directory.
          # awk terminates each record even when an input lacks a final newline.
          awk 1 "$PROVENANCE_BUNDLE" "$SBOM_BUNDLE" > release-attestations.jsonl
          python3 tools/release-publish.py draft \
            --stage release-assets --inventory release-inventory.json \
            --bundle release-attestations.jsonl --record release-draft.json \
            --tag "$TAG" --repo "$GITHUB_REPOSITORY"
          printf 'inventory=%s\n' "$(base64 -w0 release-inventory.json)" >> "$GITHUB_OUTPUT"
          printf 'record=%s\n' "$(base64 -w0 release-draft.json)" >> "$GITHUB_OUTPUT"

  # Makes the verified draft public. The Clear to Ship App holds this job in
  # the release environment until the gate for the commit is clear. The job
  # uses no signing secret; it checks the draft again and publishes it.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the draft again and publish it
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          INVENTORY: ${{ needs.build.outputs.inventory }}
          RECORD: ${{ needs.build.outputs.record }}
        run: |
          set -euo pipefail
          printf '%s' "$INVENTORY" | base64 -d > "$RUNNER_TEMP/release-inventory.json"
          printf '%s' "$RECORD" | base64 -d > "$RUNNER_TEMP/release-draft.json"
          python3 tools/release-publish.py publish \
            --inventory "$RUNNER_TEMP/release-inventory.json" --record "$RUNNER_TEMP/release-draft.json" \
            --tag "$TAG" --repo "$GITHUB_REPOSITORY"

  publish-tap:
    needs: publish
    runs-on: ubuntu-latest
    # Skip pre-release tags (e.g. v1.2.3-rc1) — they are for testing the
    # pipeline and must NOT overwrite the production cask in rebaze/homebrew-tap.
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: read
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          # rebaze-release-bot (app 3542938); a client ID is public, the key stays secret.
          client-id: Iv23liT1QG6HgP86rzYg
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: rebaze
          repositories: homebrew-tap

      # The published release's own checksums: what users download.
      - name: Download the published checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt --dir dist

      - name: Bump rio cask in rebaze/homebrew-tap
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"

          sha_for() {
            local line
            line=$(grep " $1\$" dist/checksums.txt || true)
            if [[ -z "$line" ]]; then
              echo "could not resolve checksum for $1" >&2
              cat dist/checksums.txt >&2
              exit 1
            fi
            echo "$line" | awk '{print $1}'
          }

          SHA_DARWIN_AMD=$(sha_for "rio_${VERSION}_darwin_amd64.tar.gz")
          SHA_DARWIN_ARM=$(sha_for "rio_${VERSION}_darwin_arm64.tar.gz")
          SHA_LINUX_AMD=$(sha_for "rio_${VERSION}_linux_amd64.tar.gz")
          SHA_LINUX_ARM=$(sha_for "rio_${VERSION}_linux_arm64.tar.gz")

          cat > rio.rb <<EOF
          # This file was generated by the rio release workflow. DO NOT EDIT.
          cask "rio" do
            version "${VERSION}"

            on_macos do
              on_intel do
                sha256 "${SHA_DARWIN_AMD}"
                url "https://github.com/rebaze/rio/releases/download/v#{version}/rio_#{version}_darwin_amd64.tar.gz"
              end
              on_arm do
                sha256 "${SHA_DARWIN_ARM}"
                url "https://github.com/rebaze/rio/releases/download/v#{version}/rio_#{version}_darwin_arm64.tar.gz"
              end
            end

            on_linux do
              on_intel do
                sha256 "${SHA_LINUX_AMD}"
                url "https://github.com/rebaze/rio/releases/download/v#{version}/rio_#{version}_linux_amd64.tar.gz"
              end
              on_arm do
                sha256 "${SHA_LINUX_ARM}"
                url "https://github.com/rebaze/rio/releases/download/v#{version}/rio_#{version}_linux_arm64.tar.gz"
              end
            end

            name "rio"
            desc "The rio CLI"
            homepage "https://github.com/rebaze/rio"

            livecheck do
              skip "Auto-generated on release."
            end

            binary "rio"

            # No zap stanza required

          end
          EOF

          git clone --depth=1 \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/rebaze/homebrew-tap.git" tap
          mkdir -p tap/Casks
          mv rio.rb tap/Casks/rio.rb
          cd tap
          git config user.name "rebaze-release-bot"
          git config user.email "release-bot@rebaze.com"
          git add Casks/rio.rb
          if git diff --cached --quiet; then
            echo "cask already up to date"
            exit 0
          fi
          git commit -m "rio ${VERSION}"
          git push

  verify:
    # Download, check and run what users now get, including the cask. Skipped
    # with publish-tap for pre-release tags.
    needs: publish-tap
    uses: ./.github/workflows/verify-release.yaml
    with:
      tag: ${{ github.ref_name }}
      commit: ${{ github.sha }}
    permissions:
      contents: read
      attestations: read
