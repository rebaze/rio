name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Run GoReleaser (skip homebrew tap)
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: "~> v2"
          args: release --clean --skip=homebrew
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate source CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          # Exclude GoReleaser's dist/ so the "source" SBOM reflects the
          # repository, not the build outputs produced in the previous step.
          syft dir:. \
            --exclude './dist/**' \
            --output "cyclonedx-json=dist/rio-${GITHUB_REF_NAME}-source.cdx.json"

      - name: Upload SBOM to GitHub release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" "dist/rio-${TAG}-source.cdx.json" --clobber

      - name: Attest build provenance for release archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      - name: Attest source SBOM (CycloneDX) against all archives
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
          sbom-path: dist/rio-${{ github.ref_name }}-source.cdx.json

      - name: Verify attestations (CI gate)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          archives=( dist/*.tar.gz dist/*.zip )
          if (( ${#archives[@]} == 0 )); then
            echo "no release archives found in dist/ — refusing to declare verification passed" >&2
            ls -la dist/ >&2 || true
            exit 1
          fi
          if [[ ! -f dist/checksums.txt ]]; then
            echo "dist/checksums.txt missing — refusing to declare verification passed" >&2
            exit 1
          fi

          # Two predicate-typed passes: gh attestation verify without
          # --predicate-type succeeds on the first valid attestation it finds,
          # so a single loop cannot tell whether *both* the provenance and
          # SBOM attestations are present. Enforce each explicitly.

          echo "::group::Verify SLSA provenance attestations"
          for f in "${archives[@]}" dist/checksums.txt; do
            echo "Verifying provenance: $f"
            gh attestation verify "$f" \
              --repo "${GITHUB_REPOSITORY}" \
              --predicate-type https://slsa.dev/provenance/v1
          done
          echo "::endgroup::"

          # SBOM attestations are only attached to archives (see the
          # actions/attest-sbom subject-path above), not to checksums.txt.
          echo "::group::Verify CycloneDX SBOM attestations"
          for f in "${archives[@]}"; do
            echo "Verifying SBOM: $f"
            gh attestation verify "$f" \
              --repo "${GITHUB_REPOSITORY}" \
              --predicate-type https://cyclonedx.org/bom
          done
          echo "::endgroup::"

      - name: Upload dist/ for downstream jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish-tap:
    needs: release
    runs-on: ubuntu-latest
    # Skip pre-release tags (e.g. v1.2.3-rc1) — they are for testing the
    # pipeline and must NOT overwrite the production cask in rebaze/homebrew-tap.
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: read
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: rebaze
          repositories: homebrew-tap

      - name: Download dist/
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Bump rio cask in rebaze/homebrew-tap
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"

          sha_for() {
            local line
            line=$(grep " $1\$" dist/checksums.txt || true)
            if [[ -z "$line" ]]; then
              echo "could not resolve checksum for $1" >&2
              cat dist/checksums.txt >&2
              exit 1
            fi
            echo "$line" | awk '{print $1}'
          }

          SHA_DARWIN_AMD=$(sha_for "rio_${VERSION}_darwin_amd64.tar.gz")
          SHA_DARWIN_ARM=$(sha_for "rio_${VERSION}_darwin_arm64.tar.gz")
          SHA_LINUX_AMD=$(sha_for "rio_${VERSION}_linux_amd64.tar.gz")
          SHA_LINUX_ARM=$(sha_for "rio_${VERSION}_linux_arm64.tar.gz")

          cat > rio.rb <<EOF
          # This file was generated by the rio release workflow. DO NOT EDIT.
          cask "rio" do
            version "${VERSION}"

            on_macos do
              on_intel do
                sha256 "${SHA_DARWIN_AMD}"
                url "https://github.com/rebaze/rio/releases/download/v#{version}/rio_#{version}_darwin_amd64.tar.gz"
              end
              on_arm do
                sha256 "${SHA_DARWIN_ARM}"
                url "https://github.com/rebaze/rio/releases/download/v#{version}/rio_#{version}_darwin_arm64.tar.gz"
              end
            end

            on_linux do
              on_intel do
                sha256 "${SHA_LINUX_AMD}"
                url "https://github.com/rebaze/rio/releases/download/v#{version}/rio_#{version}_linux_amd64.tar.gz"
              end
              on_arm do
                sha256 "${SHA_LINUX_ARM}"
                url "https://github.com/rebaze/rio/releases/download/v#{version}/rio_#{version}_linux_arm64.tar.gz"
              end
            end

            name "rio"
            desc "The rio CLI"
            homepage "https://github.com/rebaze/rio"

            livecheck do
              skip "Auto-generated on release."
            end

            binary "rio"

            postflight do
              # The macOS binaries are ad-hoc signed by the Go toolchain, not
              # Developer ID signed or notarized, and Homebrew tags every cask
              # download with com.apple.quarantine. Gatekeeper SIGKILLs that
              # combination, so without this "brew install rebaze/tap/rio"
              # yields a binary that dies with signal 9 until the user approves
              # it by hand in System Settings. Strip the tag at install time.
              system_command "/usr/bin/xattr",
                             args: ["-dr", "com.apple.quarantine", "#{staged_path}/rio"]
            end

            # No zap stanza required

          end
          EOF

          git clone --depth=1 \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/rebaze/homebrew-tap.git" tap
          mkdir -p tap/Casks
          mv rio.rb tap/Casks/rio.rb
          cd tap
          git config user.name "rebaze-release-bot"
          git config user.email "release-bot@rebaze.com"
          git add Casks/rio.rb
          if git diff --cached --quiet; then
            echo "cask already up to date"
            exit 0
          fi
          git commit -m "rio ${VERSION}"
          git push
