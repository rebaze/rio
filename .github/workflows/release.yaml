name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Only one writer for a tag; a failed run must never replace a release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yaml
    with:
      full_validation: true
    permissions:
      contents: read
      actions: read

  analyze:
    uses: ./.github/workflows/codeql.yaml
    permissions:
      contents: read
      actions: read
      security-events: write

  # Builds, signs and attests the release and leaves it as a verified draft.
  # The Apple signing and notary credentials are secrets of release-build, which
  # only v* tags may deploy to.
  build:
    needs: [validate, analyze]
    runs-on: ubuntu-latest
    environment: release-build
    permissions:
      contents: write
      id-token: write
      attestations: write
    # The inventory and draft record go to publish as job outputs: they are
    # small, and outputs do not expire if publish is re-run later.
    outputs:
      inventory: ${{ steps.draft.outputs.inventory }}
      record: ${{ steps.draft.outputs.record }}
      self-sbom-artifact: ${{ steps.self-sbom.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A re-run must not sign new provenance for a tag that already has a
      # draft or release: the newest provenance would no longer match the draft.
      - name: Refuse a tag that already has a release or draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: python3 tools/release-publish.py vacant --tag "$TAG" --repo "$GITHUB_REPOSITORY"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: true
          cache-dependency-path: |
            go.sum
            tools/security/go.sum

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          install-only: true

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.3

      - name: Build, sign and notarize release assets locally (no publication)
        shell: bash
        run: |
          set -euo pipefail
          # GoReleaser skips notarization when the credentials are absent; a
          # release must never fall back to unsigned macOS binaries.
          for name in MACOS_SIGN_P12 MACOS_SIGN_PASSWORD MACOS_NOTARY_KEY MACOS_NOTARY_KEY_ID MACOS_NOTARY_ISSUER_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "missing macOS signing credential: $name" >&2
              exit 1
            fi
          done
          goreleaser release --config .goreleaser.yaml --clean --skip=publish,announce,homebrew
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ vars.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ vars.MACOS_NOTARY_ISSUER_ID }}

      - name: Install pinned stable Rio for self-SBOMs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/install-self-sbom-rio.py --output "$RUNNER_TEMP/rio-stable"

      - name: Prepare release source SBOM
        id: self-sbom
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_ID: ${{ github.run_id }}.${{ github.run_attempt }}
        run: |
          set -euo pipefail
          printf 'artifact-name=rio-self-sbom-%s-%s-%s\n' "$TAG" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected a full Git source revision for release self-SBOM preparation" >&2
            exit 1
          fi
          # The tagged source is the subject; the pinned published Rio release
          # enriches and checks its inventory independently of the candidate.
          python3 tools/self-sbom.py prepare --rio "$RUNNER_TEMP/rio-stable/bin/rio" \
            --version "${TAG#v}" --project-version "$TAG" \
            --source-revision "$SOURCE_SHA" --build-url "$BUILD_URL" --build-id "$BUILD_ID" \
            --output "$RUNNER_TEMP/rio-self-sbom" --release --target-config tools/self-sbom-targets.json
          cp "$RUNNER_TEMP/rio-stable/installation.json" "$RUNNER_TEMP/rio-self-sbom/rio-tool.json"
          cp "$RUNNER_TEMP/rio-self-sbom/source.cdx.json" "dist/rio-${TAG}-source.cdx.json"

      - name: Retain prepared release self-SBOM
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.self-sbom.outputs.artifact-name || format('rio-self-sbom-{0}-{1}-{2}', github.ref_name, github.run_id, github.run_attempt) }}
          path: ${{ runner.temp }}/rio-self-sbom/
          include-hidden-files: true
          if-no-files-found: warn

      - name: Select authored notes for the exact tag
        env:
          TAG: ${{ github.ref_name }}
        run: python3 tools/release-notes.py --tag "$TAG" --notes-dir docs/releases --dist dist

      - name: Stage the exact release assets
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 tools/release-publish.py stage \
            --dist dist --stage release-assets --inventory release-inventory.json \
            --tag "$TAG" --repo "$GITHUB_REPOSITORY"

      # Every asset that can carry provenance does, so each digest is signed
      # where it was built. The checksum signature and the attestation bundle
      # are made after it.
      - name: Attest build provenance for the release assets
        id: attest-provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/checksums.txt
            release-assets/rio-${{ github.ref_name }}-source.cdx.json

      - name: Attest source SBOM (CycloneDX) against all archives
        id: attest-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/*.zip
          sbom-path: release-assets/rio-${{ github.ref_name }}-source.cdx.json

      - name: Assemble the attestation bundle
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          PROVENANCE_BUNDLE: ${{ steps.attest-provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.attest-sbom.outputs.bundle-path }}
        run: |
          set -euo pipefail
          for bundle in "$PROVENANCE_BUNDLE" "$SBOM_BUNDLE"; do
            if [[ ! -s "$bundle" ]]; then
              echo "attestation bundle missing or empty: ${bundle:-<unset>}" >&2
              exit 1
            fi
          done
          # Keep the assembled bundle outside the frozen staging directory.
          # awk terminates each record even when an input lacks a final newline.
          mkdir release-bundle
          awk 1 "$PROVENANCE_BUNDLE" "$SBOM_BUNDLE" > "release-bundle/rio-${TAG}.intoto.jsonl"

      - name: Verify staged assets and upload them as a draft
        id: draft
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 tools/release-publish.py draft \
            --stage release-assets --inventory release-inventory.json \
            --bundle "release-bundle/rio-${TAG}.intoto.jsonl" --record release-draft.json \
            --tag "$TAG" --repo "$GITHUB_REPOSITORY"
          printf 'inventory=%s\n' "$(base64 -w0 release-inventory.json)" >> "$GITHUB_OUTPUT"
          printf 'record=%s\n' "$(base64 -w0 release-draft.json)" >> "$GITHUB_OUTPUT"

  # Makes the verified draft public, right after build. The job uses no
  # signing secret; it checks that the draft still holds exactly the staged
  # files and digests, then publishes it. The release environment accepts only
  # v* tags and has no approval rule: pushing the tag, which only admins may
  # do, is the human decision to release.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the draft again and publish it
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          INVENTORY: ${{ needs.build.outputs.inventory }}
          RECORD: ${{ needs.build.outputs.record }}
        run: |
          set -euo pipefail
          printf '%s' "$INVENTORY" | base64 -d > "$RUNNER_TEMP/release-inventory.json"
          printf '%s' "$RECORD" | base64 -d > "$RUNNER_TEMP/release-draft.json"
          python3 tools/release-publish.py publish \
            --inventory "$RUNNER_TEMP/release-inventory.json" --record "$RUNNER_TEMP/release-draft.json" \
            --tag "$TAG" --repo "$GITHUB_REPOSITORY"

  # Retry this job alone after delivery failures. Restore the newest actual
  # delivery attempt's evidence so accepted submissions only repeat read-back.
  # Missing history/evidence requires reconciliation, never a pristine resend.
  deliver-sbom:
    name: deliver-sbom
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact-name: ${{ steps.delivery-artifact.outputs.artifact-name }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Record delivery artifact identity
        id: delivery-artifact
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          printf 'artifact-name=release-self-sbom-delivery-%s-%s-%s\n' "$TAG" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned stable Rio for self-SBOMs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/install-self-sbom-rio.py --output "$RUNNER_TEMP/rio-stable"
      - name: Restore prior delivery state and download published source SBOM
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PREPARED_ARTIFACT: ${{ needs.build.outputs.self-sbom-artifact }}
        run: |
          set -euo pipefail
          PREPARED_ARTIFACT=$(python3 - <<'PY'
          import json
          import os
          import subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
          tag = os.environ["TAG"]
          endpoint = f"repos/{repo}/actions/runs/{run_id}"

          def items(path, key):
              page = 1
              while True:
                  response = subprocess.run(
                      ["gh", "api", f"{path}?per_page=100&page={page}"],
                      check=True, capture_output=True, text=True)
                  entries = json.loads(response.stdout)[key]
                  if not isinstance(entries, list):
                      raise SystemExit("invalid delivery evidence metadata")
                  yield from entries
                  if len(entries) < 100:
                      return
                  page += 1

          previous = None
          for prior in range(attempt - 1, 0, -1):
              jobs = items(f"{endpoint}/attempts/{prior}/jobs", "jobs")
              if any(job["name"] == "deliver-sbom" and job.get("conclusion") != "skipped"
                     for job in jobs):
                  previous = prior
                  break

          if previous is None:
              # Earlier build/publish retries do not imply delivery has run.
              selected = os.environ["PREPARED_ARTIFACT"]
              if not selected:
                  raise SystemExit("original build self-SBOM artifact identity is missing")
          else:
              selected = f"release-self-sbom-delivery-{tag}-{run_id}-{previous}"
              matches = [artifact for artifact in items(f"{endpoint}/artifacts", "artifacts")
                         if artifact["name"] == selected
                         and artifact.get("workflow_run", {}).get("id") == int(run_id)]
              if len(matches) != 1 or matches[0].get("expired") is not False:
                  raise SystemExit(
                      f"delivery evidence from attempt {previous} is missing or expired; "
                      "restore evidence or reconcile the native delivery before retrying")
          print(selected)
          PY
          )
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$PREPARED_ARTIFACT" --dir "$RUNNER_TEMP/rio-self-sbom"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "rio-${TAG}-source.cdx.json" --dir "$RUNNER_TEMP/rio-published-sbom"
      - name: Deliver the exact published source SBOM
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          DTRACK_API_KEY: ${{ secrets.RIO_DTRACK_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$DTRACK_API_KEY" ]]; then
            echo "RIO_DTRACK_API_KEY is required for release self-SBOM delivery" >&2
            exit 1
          fi
          python3 tools/self-sbom.py deliver --rio "$RUNNER_TEMP/rio-stable/bin/rio" \
            --prepared "$RUNNER_TEMP/rio-self-sbom" --target-config tools/self-sbom-targets.json \
            --published-sbom "$RUNNER_TEMP/rio-published-sbom/rio-${TAG}-source.cdx.json"
      - name: Retain release self-SBOM delivery receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.delivery-artifact.outputs.artifact-name }}
          path: ${{ runner.temp }}/rio-self-sbom/
          include-hidden-files: true
          if-no-files-found: warn

  # Only published releases can reach lifecycle management. The release
  # environment holds this key; CI and native upload use their narrower key.
  promote-sbom:
    needs: [publish, deliver-sbom]
    if: github.event_name == 'push' && github.repository == 'rebaze/rio' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      actions: read
    concurrency:
      group: rio-release-sbom-promotion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned stable Rio for self-SBOMs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/install-self-sbom-rio.py --output "$RUNNER_TEMP/rio-stable"
      - name: Restore accepted delivery evidence and published source SBOM
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DELIVERY_ARTIFACT: ${{ needs.deliver-sbom.outputs.artifact-name }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$DELIVERY_ARTIFACT" --dir "$RUNNER_TEMP/rio-self-sbom"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "rio-${TAG}-source.cdx.json" --dir "$RUNNER_TEMP/rio-published-sbom"
      - name: Promote the verified latest stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DTRACK_LIFECYCLE_KEY: ${{ secrets.RIO_DTRACK_LIFECYCLE_KEY }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 tools/self-sbom-lifecycle.py promote --rio "$RUNNER_TEMP/rio-stable/bin/rio" \
            --prepared "$RUNNER_TEMP/rio-self-sbom" \
            --published-sbom "$RUNNER_TEMP/rio-published-sbom/rio-${TAG}-source.cdx.json" \
            --tag "$TAG" --commit "$COMMIT" --target-config tools/self-sbom-targets.json --repo rebaze/rio
      - name: Retain release lifecycle evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-self-sbom-lifecycle-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rio-self-sbom/
          include-hidden-files: true
          if-no-files-found: warn

  publish-tap:
    needs: publish
    runs-on: ubuntu-latest
    # Skip pre-release tags (e.g. v1.2.3-rc1) — they are for testing the
    # pipeline and must NOT overwrite the production cask in rebaze/homebrew-tap.
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: read
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          # rebaze-release-bot (app 3542938); a client ID is public, the key stays secret.
          client-id: Iv23liT1QG6HgP86rzYg
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: rebaze
          repositories: homebrew-tap

      # The published release's own checksums: what users download.
      - name: Download the published checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt --dir dist

      - name: Bump rio cask in rebaze/homebrew-tap
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"

          sha_for() {
            local line
            line=$(grep " $1\$" dist/checksums.txt || true)
            if [[ -z "$line" ]]; then
              echo "could not resolve checksum for $1" >&2
              cat dist/checksums.txt >&2
              exit 1
            fi
            echo "$line" | awk '{print $1}'
          }

          SHA_DARWIN_AMD=$(sha_for "rio_${VERSION}_darwin_amd64.tar.gz")
          SHA_DARWIN_ARM=$(sha_for "rio_${VERSION}_darwin_arm64.tar.gz")
          SHA_LINUX_AMD=$(sha_for "rio_${VERSION}_linux_amd64.tar.gz")
          SHA_LINUX_ARM=$(sha_for "rio_${VERSION}_linux_arm64.tar.gz")

          cat > rio.rb <<EOF
          # This file was generated by the rio release workflow. DO NOT EDIT.
          cask "rio" do
            version "${VERSION}"

            on_macos do
              on_intel do
                sha256 "${SHA_DARWIN_AMD}"
                url "https://github.com/rebaze/rio/releases/download/v#{version}/rio_#{version}_darwin_amd64.tar.gz"
              end
              on_arm do
                sha256 "${SHA_DARWIN_ARM}"
                url "https://github.com/rebaze/rio/releases/download/v#{version}/rio_#{version}_darwin_arm64.tar.gz"
              end
            end

            on_linux do
              on_intel do
                sha256 "${SHA_LINUX_AMD}"
                url "https://github.com/rebaze/rio/releases/download/v#{version}/rio_#{version}_linux_amd64.tar.gz"
              end
              on_arm do
                sha256 "${SHA_LINUX_ARM}"
                url "https://github.com/rebaze/rio/releases/download/v#{version}/rio_#{version}_linux_arm64.tar.gz"
              end
            end

            name "rio"
            desc "The rio CLI"
            homepage "https://github.com/rebaze/rio"

            livecheck do
              skip "Auto-generated on release."
            end

            binary "rio"

            # No zap stanza required

          end
          EOF

          git clone --depth=1 \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/rebaze/homebrew-tap.git" tap
          mkdir -p tap/Casks
          mv rio.rb tap/Casks/rio.rb
          cd tap
          git config user.name "rebaze-release-bot"
          git config user.email "release-bot@rebaze.com"
          git add Casks/rio.rb
          if git diff --cached --quiet; then
            echo "cask already up to date"
            exit 0
          fi
          git commit -m "rio ${VERSION}"
          git push

  verify:
    # Download, check and run what users now get, including the cask. Skipped
    # with publish-tap for pre-release tags.
    needs: publish-tap
    uses: ./.github/workflows/verify-release.yaml
    with:
      tag: ${{ github.ref_name }}
      commit: ${{ github.sha }}
    permissions:
      contents: read
      attestations: read
