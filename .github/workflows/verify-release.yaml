name: Verify published release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable tag
        required: true
      commit:
        description: Exact verified source commit
        required: true
permissions:
  contents: read
  attestations: read
jobs:
  native-download:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Preserve authored note bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Verify downloaded bytes and execute native client handoff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          python tools/verify-release.py --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" \
            --notes "docs/releases/$RELEASE_TAG.md" --output "$RUNNER_TEMP/rio-published"
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/rio-published/verification.json
            ${{ runner.temp }}/rio-published/attestations.json
            ${{ runner.temp }}/rio-published/native-demo.log
          if-no-files-found: warn
  homebrew-install:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Install the cask only on this disposable runner
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install --cask rebaze/tap/rio
          rio version > "$RUNNER_TEMP/brew-version.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path
          text = (Path(os.environ['RUNNER_TEMP']) / 'brew-version.txt').read_text()
          expected = 'rio ' + os.environ['RELEASE_TAG'][1:] + ' (commit: ' + os.environ['RELEASE_COMMIT'] + ', built: '
          assert text.startswith(expected), 'installed cask version/commit differs'
          print(text)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-install
          path: ${{ runner.temp }}/brew-version.txt
