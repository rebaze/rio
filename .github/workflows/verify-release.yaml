name: Verify published release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable tag
        required: true
      commit:
        description: Exact verified source commit
        required: true
permissions:
  contents: read
  attestations: read
jobs:
  native-download:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Preserve authored note bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          path: source
      # Use the current reviewed tool recipe even when verifying an older release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: workflow
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: workflow/go.mod
          cache-dependency-path: |
            workflow/go.sum
            workflow/tools/security/go.sum
            workflow/tools/release-toolchain/*/go.sum
      - name: Build and audit the recipient verifier
        shell: bash
        run: |
          python workflow/tools/release-toolchain/build.py --tool cosign --output "$RUNNER_TEMP/rio-release-tools"
          echo "$RUNNER_TEMP/rio-release-tools" >> "$GITHUB_PATH"
      - name: Verify downloaded bytes and execute native client handoff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$RELEASE_COMMIT"
          python workflow/tools/verify-release.py --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" \
            --notes "source/docs/releases/$RELEASE_TAG.md" --output "$RUNNER_TEMP/rio-published"
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/rio-published/verification.json
            ${{ runner.temp }}/rio-published/attestations.json
            ${{ runner.temp }}/rio-published/native-demo.log
          if-no-files-found: warn
  homebrew-install:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Install the cask only on this disposable runner
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install --cask rebaze/tap/rio
          rio version > "$RUNNER_TEMP/brew-version.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path
          text = (Path(os.environ['RUNNER_TEMP']) / 'brew-version.txt').read_text()
          expected = 'rio ' + os.environ['RELEASE_TAG'][1:] + ' (commit: ' + os.environ['RELEASE_COMMIT'] + ', built: '
          assert text.startswith(expected), 'installed cask version/commit differs'
          print(text)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-install
          path: ${{ runner.temp }}/brew-version.txt
