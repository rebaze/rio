name: Scan published release

# CI scans main daily; this scans the binaries users already downloaded.
on:
  schedule:
    - cron: '30 6 * * 1' # Mondays, after Dependabot's weekly run.
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable tag (default the latest release)
        required: false

permissions:
  contents: read
  attestations: read

concurrency:
  group: release-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: tools/security/go.sum

      - name: Verify and scan every published binary
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: python3 tools/release-scan.py --tag "${TAG:-}" --repo "$GITHUB_REPOSITORY" --output "$RUNNER_TEMP/release-scan"

      - name: Retain the scan report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-scan
          path: |
            ${{ runner.temp }}/release-scan/scan.json
            ${{ runner.temp }}/release-scan/*.txt
          if-no-files-found: warn
          retention-days: 90
