name: Change class

# Labels every PR class:standard or class:significant from its changed files and
# the substantial-modification box. Reads API metadata only and runs the base
# branch's copy of the tool, never the PR's. On pull_request a fork PR gets a
# read-only token: the class is then reported in the summary, not labelled (#208).
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

concurrency:
  group: change-class-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The base branch's own tool, never the PR's: pull_request would check
      # out the PR's merge commit, so name the base commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Classify and label
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$FORK" = true ]; then
            python3 tools/change-class.py --repo "$GITHUB_REPOSITORY" --pr "$PR" --no-label
          else
            python3 tools/change-class.py --repo "$GITHUB_REPOSITORY" --pr "$PR"
          fi
