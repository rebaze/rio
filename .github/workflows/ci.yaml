name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '45 5 * * *' # Recheck unchanged dependencies against new advisories.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Keep this inside the existing required build check so vulnerable
      # upgrades cannot pass branch protection via a separate optional job.
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          license-check: false
          comment-summary-in-pr: never

      - name: Detect changed file types
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            git cat-file -e "$BASE" 2>/dev/null || git fetch --no-tags --depth=1 origin "$BASE"
            CHANGED=$(git diff --name-only "$BASE...HEAD")
          else
            BASE="${{ github.event.before }}"
            if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE" 2>/dev/null; then
              CHANGED=$(git diff --name-only "$BASE" HEAD)
            else
              CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git ls-files)
            fi
          fi
          echo "Changed files:"
          echo "$CHANGED"
          go=false
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then go=true; fi
          goreleaser=false
          shell=false
          python=false
          # Fixtures, golden files and the embedded CycloneDX schemas are
          # inputs to the test suite, so a change to any of them has to run it.
          # Missing that is how a stale golden file reaches main.
          if grep -E '(\.go$|(^|/)go\.(mod|sum)$|(^|/)testdata/|^internal/sbom/schemas/|^Makefile$)' <<<"$CHANGED" >/dev/null; then go=true; fi
          if grep -E '^\.github/workflows/.*\.ya?ml$' <<<"$CHANGED" >/dev/null; then go=true; fi
          if grep -E '^\.goreleaser\.yaml$' <<<"$CHANGED" >/dev/null; then goreleaser=true; fi
          if grep -E '\.sh$' <<<"$CHANGED" >/dev/null; then shell=true; fi
          if grep -E '(\.py$|^\.github/workflows/dependabot-auto-merge\.yaml$)' <<<"$CHANGED" >/dev/null; then python=true; fi
          if grep -E '^\.github/workflows/ci\.yaml$' <<<"$CHANGED" >/dev/null; then go=true; goreleaser=true; shell=true; python=true; fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "goreleaser=$goreleaser" >> "$GITHUB_OUTPUT"
          echo "shell=$shell" >> "$GITHUB_OUTPUT"
          echo "python=$python" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.changes.outputs.go == 'true' || steps.changes.outputs.goreleaser == 'true'
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/security/go.sum

      # Pin the scanner and its dependencies in a separate tools module.
      # Dependabot updates that module; the vulnerability database stays live.
      # Text output exits nonzero when reachable vulnerabilities are found.
      - name: Scan Go dependencies for reachable vulnerabilities
        if: steps.changes.outputs.go == 'true'
        run: |
          go -C tools/security mod tidy -diff
          go -C tools/security mod verify
          go -C tools/security tool govulncheck -C ../.. -format text ./...

      - name: Check formatting
        if: steps.changes.outputs.go == 'true'
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:" >&2
            echo "$unformatted" >&2
            gofmt -d $unformatted >&2
            exit 1
          fi

      # go.mod carried six direct dependencies marked // indirect, which nothing
      # caught because CI never ran tidy. The dependency list is a review
      # surface here: §8 fixes the shipped set at six and says a seventh needs
      # justification in the PR, so it has to stay honest.
      - name: Check go.mod is tidy
        if: steps.changes.outputs.go == 'true'
        run: go mod tidy -diff

      - name: Build
        if: steps.changes.outputs.go == 'true'
        run: go build ./...

      - name: Vet
        if: steps.changes.outputs.go == 'true'
        run: go vet ./...

      - name: Test
        if: steps.changes.outputs.go == 'true'
        run: go test -race ./...

      # rio must stay a self-contained static binary with no runtime
      # dependency on external tools, and it must make no network calls
      # (§8, and the "no network access anywhere in the binary" acceptance
      # criterion). Building with CGO off is the part CI can enforce.
      - name: Build the release binary the way GoReleaser does
        if: steps.changes.outputs.go == 'true'
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          go build -trimpath -o rio ./cmd/rio
          ./rio version
          ./rio normalize --help > /dev/null
          ./rio plan --help > /dev/null

      - name: Lint shell scripts
        if: steps.changes.outputs.shell == 'true'
        run: |
          set -euo pipefail
          # Preinstalled on the GitHub-hosted ubuntu images; installed here so
          # the job also runs on a bare container or under act.
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fi
          shellcheck --version
          shellcheck -s sh install.sh
          shellcheck tools/rio-dtrack-upload.sh install_test.sh tools/rio-dtrack-upload_test.sh

      - name: Test the shell scripts offline
        if: steps.changes.outputs.shell == 'true'
        run: |
          set -euo pipefail
          ./install_test.sh
          ./tools/rio-dtrack-upload_test.sh

      # build-p2-table.py advertises "Python 3.9+ and nothing else", and that
      # is a promise about the interpreter a client already has rather than a
      # rough guess. Pinning the floor here is what keeps it true: on the
      # runner's own newer python, a 3.10-only expression would pass and only
      # fail on the workstation it was written for.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: steps.changes.outputs.python == 'true'
        with:
          python-version: "3.9"

      - name: Test the Python tools
        if: steps.changes.outputs.python == 'true'
        run: |
          set -euo pipefail
          python3 --version
          python3 tools/build-p2-table_test.py
          python3 tools/dependabot-auto-merge_test.py
          python3 tools/ci-changes_test.py

      - name: Install GoReleaser
        if: steps.changes.outputs.goreleaser == 'true'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          install-only: true

      - name: Validate GoReleaser config
        if: steps.changes.outputs.goreleaser == 'true'
        run: goreleaser check
