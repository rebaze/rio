name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '45 5 * * *' # Recheck unchanged dependencies against new advisories.
  workflow_dispatch:
  workflow_call:
    inputs:
      full_validation:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.ref) }}
  # Eligible main uploads must finish even when a newer source revision arrives.
  cancel-in-progress: ${{ !(github.workflow == 'CI' && github.repository == 'rebaze/rio' && github.ref == 'refs/heads/main' && contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name)) }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Keep this inside the existing required build check so vulnerable
      # upgrades cannot pass branch protection via a separate optional job.
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          license-check: false
          comment-summary-in-pr: never

      # This cheap offline check also guards module-only and workflow-only PRs
      # whose changes do not otherwise enable the Python test suite.
      - name: Check Go compiler policy
        run: python3 tools/go-toolchain_test.py

      - name: Check Scorecard vulnerability policy
        run: python3 tools/scorecard-policy_test.py

      - name: Detect changed file types
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            git cat-file -e "$BASE" 2>/dev/null || git fetch --no-tags --depth=1 origin "$BASE"
            CHANGED=$(git diff --name-only "$BASE...HEAD")
          else
            BASE="${{ github.event.before }}"
            if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE" 2>/dev/null; then
              CHANGED=$(git diff --name-only "$BASE" HEAD)
            else
              CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git ls-files)
            fi
          fi
          echo "Changed files:"
          echo "$CHANGED"
          go=false
          goreleaser=false
          shell=false
          python=false
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ inputs.full_validation || false }}" = "true" ]; then
            go=true; goreleaser=true; shell=true; python=true
          fi
          # Fixtures, golden files and the embedded CycloneDX schemas are
          # inputs to the test suite, so a change to any of them has to run it.
          # Missing that is how a stale golden file reaches main.
          if grep -E '(\.go$|(^|/)go\.(mod|sum)$|(^|/)testdata/|^internal/sbom/schemas/|^Makefile$|^tools/demo-(enrichment|context|artifact-sets|agent-integration|repair|delivery|oci|dtrack-tls|normalization-evidence|client-record|attest-sign|recovery|use-case)/|^docs/agent-integration\.md$|^tools/rio-context(_test)?\.py$|^tools/rio-attest-(sign(_test)?|verify)\.sh$|^tools/source-sbom\.sh$|^tools/source-sbom-modules\.json$)' <<<"$CHANGED" >/dev/null; then go=true; fi
          if grep -E '^\.github/workflows/.*\.ya?ml$' <<<"$CHANGED" >/dev/null; then go=true; fi
          if grep -E '^tools/(source-sbom|self-sbom|install-self-sbom-rio)' <<<"$CHANGED" >/dev/null; then go=true; python=true; fi
          if grep -E '^\.goreleaser\.yaml$' <<<"$CHANGED" >/dev/null; then goreleaser=true; fi
          if grep -E '\.sh$' <<<"$CHANGED" >/dev/null; then shell=true; fi
          if grep -E '(\.py$|^\.github/workflows/(dependabot-auto-merge|release|release-preflight)\.yaml$)' <<<"$CHANGED" >/dev/null; then python=true; fi
          if grep -E '^(\.github/workflows/ci\.yaml|\.go-version)$' <<<"$CHANGED" >/dev/null; then go=true; goreleaser=true; shell=true; python=true; fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "goreleaser=$goreleaser" >> "$GITHUB_OUTPUT"
          echo "shell=$shell" >> "$GITHUB_OUTPUT"
          echo "python=$python" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.changes.outputs.go == 'true' || steps.changes.outputs.goreleaser == 'true'
        with:
          # Track security patches within the reviewed minor line. An exact
          # go.mod patch stays exact even with check-latest (#224).
          go-version-file: .go-version
          check-latest: true
          cache: true
          cache-dependency-path: |
            go.sum
            tools/security/go.sum

      # Pin the scanner and its dependencies in a separate tools module.
      # Dependabot updates that module; the vulnerability database stays live.
      # Text output exits nonzero when reachable vulnerabilities are found.
      - name: Scan Go dependencies for reachable vulnerabilities
        if: steps.changes.outputs.go == 'true'
        run: |
          go -C tools/security mod tidy -diff
          go -C tools/security mod verify
          go -C tools/security tool govulncheck -C ../.. -format text ./...
          go -C tools/security tool govulncheck -format text golang.org/x/vuln/cmd/govulncheck
          go -C tools/security tool govulncheck -format text github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod

      - name: Check formatting
        if: steps.changes.outputs.go == 'true'
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:" >&2
            echo "$unformatted" >&2
            gofmt -d $unformatted >&2
            exit 1
          fi

      # go.mod carried six direct dependencies marked // indirect, which nothing
      # caught because CI never ran tidy. The dependency list is a review
      # surface here: §8 fixes the shipped set at six and says a seventh needs
      # justification in the PR, so it has to stay honest.
      - name: Check go.mod is tidy
        if: steps.changes.outputs.go == 'true'
        run: go mod tidy -diff

      - name: Build
        if: steps.changes.outputs.go == 'true'
        run: go build ./...

      - name: Vet
        if: steps.changes.outputs.go == 'true'
        run: go vet ./...

      - name: Test
        if: steps.changes.outputs.go == 'true'
        run: go test -race ./...

      # rio must stay a self-contained static binary with no runtime
      # dependency on external tools. Normalization/planning stay offline;
      # explicit delivery may construct clients. Build with CGO off.
      - name: Build the release binary the way GoReleaser does
        if: steps.changes.outputs.go == 'true'
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          go build -trimpath -o rio ./cmd/rio
          ./rio version
          ./rio normalize --help > /dev/null
          ./rio plan --help > /dev/null
          ./tools/demo-repair/run.sh "$PWD/rio"
          ./tools/demo-enrichment/run.sh "$PWD/rio"
          ./tools/demo-context/run.sh "$PWD/rio"
          ./tools/demo-artifact-sets/run.sh "$PWD/rio"
          ./tools/demo-agent-integration/run.sh "$PWD/rio"
          RIO_BIN="$PWD/rio" python3 tools/demo-agent-integration/test.py
          RIO_BIN="$PWD/rio" python3 tools/rio-context_test.py

      - name: Install GoReleaser
        if: steps.changes.outputs.go == 'true' || steps.changes.outputs.goreleaser == 'true'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          install-only: true

      - name: Install cosign
        if: steps.changes.outputs.go == 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.3

      - name: Install pinned stable Rio for self-SBOMs
        if: steps.changes.outputs.go == 'true' || steps.changes.outputs.python == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/install-self-sbom-rio.py --output "$RUNNER_TEMP/rio-stable"

      - name: Exercise source-SBOM generation
        if: steps.changes.outputs.go == 'true'
        run: |
          tools/source-sbom.sh 0.0.0 "$RUNNER_TEMP/rio-source.cdx.json" "$RUNNER_TEMP/rio-stable/bin/rio" "$RUNNER_TEMP/rio-source-receipt.json"
          # The SBOM declares a complete inventory of its subject, and the
          # standard library is a dependency of every module.
          jq -e '.metadata.component["bom-ref"] as $root
            | ([.components[] | select(.name == "stdlib")."bom-ref"][0]) as $std
            | .bomFormat == "CycloneDX" and .specVersion == "1.6" and (.components | length) > 0
            and .compositions == [{aggregate: "complete", assemblies: [$root], dependencies: ([$root] + [.components[]."bom-ref"])}]
            and (.dependencies | length) == (.components | length) + 1 and $std != null
            and all(.dependencies[] | select(.ref != $std); .dependsOn | index($std))' "$RUNNER_TEMP/rio-source.cdx.json"
          # rio's own SBOM passes rio's strict gate against BSI TR-03183-2 2.1.0
          # with no findings, every component evaluated, and name, version and
          # purl still required: what the release notes claim of it.
          jq -e '.artifacts[0].checks | . as $c
            | .gate == "pass" and .mode == "fail" and .schema == "pass" and .findings == 0
            and .componentEvaluation == "evaluated" and .profile.name == "bsi-tr-03183-2@2.1.0"
            and all("name", "version", "purl"; . as $r | $c.componentRequirements | index($r))' "$RUNNER_TEMP/rio-source-receipt.json"

      - name: Exercise GoReleaser without publishing
        if: steps.changes.outputs.go == 'true' || steps.changes.outputs.goreleaser == 'true'
        run: goreleaser release --config .goreleaser.yaml --snapshot --skip=publish,announce,sign,homebrew

      - name: Sign and independently verify synthetic normalization statements
        if: steps.changes.outputs.go == 'true'
        run: python3 tools/demo-attest-sign/run.py "$PWD/rio"

      - name: Lint shell scripts
        if: steps.changes.outputs.shell == 'true'
        run: |
          set -euo pipefail
          # Preinstalled on the GitHub-hosted ubuntu images; installed here so
          # the job also runs on a bare container or under act.
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fi
          shellcheck --version
          shellcheck -s sh tools/demo-repair/run.sh tools/demo-agent-integration/*.sh tools/demo-agent-integration/projects/*/build.sh tools/demo-artifact-sets/run.sh install.sh tools/demo-enrichment/run.sh tools/demo-context/run.sh tools/demo-context/check-replacement.sh tools/source-sbom.sh
          shellcheck install_test.sh
          shellcheck tools/rio-attest-sign.sh tools/rio-attest-sign_test.sh tools/rio-attest-verify.sh

      - name: Test the installer offline
        if: steps.changes.outputs.shell == 'true'
        run: |
          set -euo pipefail
          ./install_test.sh
          ./tools/rio-attest-sign_test.sh

      # build-p2-table.py advertises "Python 3.9+ and nothing else", and that
      # is a promise about the interpreter a client already has rather than a
      # rough guess. Pinning the floor here is what keeps it true: on the
      # runner's own newer python, a 3.10-only expression would pass and only
      # fail on the workstation it was written for.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.changes.outputs.python == 'true'
        with:
          python-version: "3.9"

      - name: Test the Python tools
        if: steps.changes.outputs.python == 'true'
        env:
          RIO_BIN: ${{ github.workspace }}/rio
          SELF_SBOM_TEST_RIO: ${{ runner.temp }}/rio-stable/bin/rio
          SOURCE_SBOM_TEST_RIO: ${{ runner.temp }}/rio-stable/bin/rio
        run: |
          set -euo pipefail
          python3 --version
          python3 tools/build-p2-table_test.py
          python3 tools/dependabot-auto-merge_test.py
          python3 tools/ci-changes_test.py
          python3 tools/ci-complete_test.py
          python3 tools/source-sbom_test.py
          python3 tools/self-sbom_test.py
          python3 tools/self-sbom-workflows_test.py
          python3 tools/self-sbom-lifecycle_test.py
          python3 tools/install-self-sbom-rio_test.py
          python3 tools/rio-context_test.py
          python3 tools/release-publish_test.py
          python3 tools/release-notes_test.py
          python3 tools/release-scan_test.py
          python3 tools/revert-cask_test.py
          python3 tools/change-class_test.py
          python3 tools/verify-release_test.py
          python3 tools/demo-delivery/integration/setup_test.py

      - name: Validate GoReleaser config
        if: steps.changes.outputs.goreleaser == 'true'
        run: goreleaser check --config .goreleaser.yaml

  # Independent of path filtering: every revision has an inventory, including
  # documentation-only changes. Canonical main may publish it in a separate job;
  # PRs, branches and reusable callers retain artifact-only observations.
  self-sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      publish-main: ${{ steps.prepare.outputs.publish-main }}
      artifact-name: ${{ steps.prepare.outputs.artifact-name }}
      source-sha: ${{ steps.prepare.outputs.source-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: true
          cache-dependency-path: |
            go.sum
            tools/security/go.sum
      - name: Install pinned stable Rio for self-SBOMs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/install-self-sbom-rio.py --output "$RUNNER_TEMP/rio-stable"
      - name: Exercise installed-binary self-SBOM demonstration offline
        run: python3 tools/demo-self-sbom/run.py "$RUNNER_TEMP/rio-stable/bin/rio" --run-id ci-demo
      - name: Prepare source SBOM
        id: prepare
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_SHA: ${{ github.sha }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_ID: ${{ github.run_id }}.${{ github.run_attempt }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected a full Git source revision for self-SBOM preparation" >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            project_version="pr-$PR_NUMBER"
          elif [[ "$REF_TYPE" == "tag" ]]; then
            # Reusable release validation is still a development observation.
            project_version="ci-tag-$REF_NAME"
          else
            project_version="dev-$REF_NAME"
          fi
          project_version="${project_version}-${SOURCE_SHA:0:12}.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          publish_main=false
          mode=(--artifact-only)
          if [[ "$WORKFLOW_NAME" == "CI" && "$REPOSITORY" == "rebaze/rio" && "$REF" == "refs/heads/main" &&
                ( "$EVENT_NAME" == "push" || "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ) ]]; then
            publish_main=true
            project_version=main
            mode=(--target-config tools/self-sbom-targets.json)
          fi
          printf 'publish-main=%s\nartifact-name=self-sbom-ci-%s-%s\nsource-sha=%s\n' \
            "$publish_main" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          python3 tools/self-sbom.py prepare --rio "$RUNNER_TEMP/rio-stable/bin/rio" \
            --version "0.0.0-ci.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" \
            --source-revision "$SOURCE_SHA" --build-url "$BUILD_URL" --build-id "$BUILD_ID" \
            --project-version "$project_version" --output "$RUNNER_TEMP/rio-self-sbom" "${mode[@]}"
          cp "$RUNNER_TEMP/rio-stable/installation.json" "$RUNNER_TEMP/rio-self-sbom/rio-tool.json"
          printf '{"source_sha":"%s","run_id":"%s","run_attempt":"%s","publish_main":%s}\n' \
            "$SOURCE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$publish_main" > "$RUNNER_TEMP/rio-self-sbom/build-context.json"
      - name: Explain artifact-only observation
        if: steps.prepare.outputs.publish-main == 'false'
        run: echo 'Self-SBOM checked and retained. This artifact-only context does not enter the protected main publication environment.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain self-SBOM and delivery receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.prepare.outputs.artifact-name || format('self-sbom-ci-{0}-{1}', github.run_id, github.run_attempt) }}
          path: ${{ runner.temp }}/rio-self-sbom/
          include-hidden-files: true
          if-no-files-found: warn

  # Only the actual canonical main writer enters this protected environment
  # and shared queue. Artifact-only CI contexts skip this job entirely.
  publish-main-sbom:
    name: publish-main-sbom
    if: needs.self-sbom.result == 'success' && needs.self-sbom.outputs.publish-main == 'true'
    needs: self-sbom
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: rio-main
    permissions:
      contents: read
      actions: read
    concurrency:
      group: rio-main-sbom
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.self-sbom.result == 'success' && needs.self-sbom.outputs.publish-main == 'true'
        with:
          ref: ${{ needs.self-sbom.outputs.source-sha }}
          persist-credentials: false
      - name: Install pinned stable Rio for self-SBOMs
        if: needs.self-sbom.result == 'success' && needs.self-sbom.outputs.publish-main == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/install-self-sbom-rio.py --output "$RUNNER_TEMP/rio-stable"
      - name: Restore prior main delivery state
        if: needs.self-sbom.result == 'success' && needs.self-sbom.outputs.publish-main == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED_ARTIFACT: ${{ needs.self-sbom.outputs.artifact-name }}
        run: |
          set -euo pipefail
          PREPARED_ARTIFACT=$(python3 - <<'PY'
          import json
          import os
          import subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
          endpoint = f"repos/{repo}/actions/runs/{run_id}"

          def items(path, key):
              page = 1
              while True:
                  response = subprocess.run(
                      ["gh", "api", f"{path}?per_page=100&page={page}"],
                      check=True, capture_output=True, text=True)
                  entries = json.loads(response.stdout)[key]
                  if not isinstance(entries, list):
                      raise SystemExit("invalid delivery evidence metadata")
                  yield from entries
                  if len(entries) < 100:
                      return
                  page += 1

          previous = None
          for prior in range(attempt - 1, 0, -1):
              jobs = items(f"{endpoint}/attempts/{prior}/jobs", "jobs")
              if any(job["name"] == "publish-main-sbom" and any(
                         step["name"] == "Deliver main source SBOM" and step.get("conclusion") != "skipped"
                         for step in job.get("steps", [])) for job in jobs):
                  previous = prior
                  break
          selected = os.environ["PREPARED_ARTIFACT"]
          if previous is not None:
              selected = f"main-self-sbom-delivery-{run_id}-{previous}"
              matches = [artifact for artifact in items(f"{endpoint}/artifacts", "artifacts")
                         if artifact["name"] == selected
                         and artifact.get("workflow_run", {}).get("id") == int(run_id)]
              if len(matches) != 1 or matches[0].get("expired") is not False:
                  raise SystemExit("prior main delivery evidence is missing or expired; reconcile before retrying")
          if not selected:
              raise SystemExit("original prepared self-SBOM artifact identity is missing")
          print(selected)
          PY
          )
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$PREPARED_ARTIFACT" --dir "$RUNNER_TEMP/rio-self-sbom"
      - name: Skip superseded main source revisions
        id: current
        if: needs.self-sbom.result == 'success' && needs.self-sbom.outputs.publish-main == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.self-sbom.outputs.source-sha }}
        run: |
          set -euo pipefail
          head=$(gh api repos/rebaze/rio/git/ref/heads/main --jq '.object.sha')
          if [[ "$head" == "$SOURCE_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'Main self-SBOM publication skipped: a newer source revision is current.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deliver main source SBOM
        if: steps.current.outputs.current == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DTRACK_MAIN_KEY: ${{ secrets.RIO_DTRACK_MAIN_KEY }}
          SOURCE_SHA: ${{ needs.self-sbom.outputs.source-sha }}
        run: |
          set -euo pipefail
          if [[ -z "$DTRACK_MAIN_KEY" ]]; then
            echo "RIO_DTRACK_MAIN_KEY is required for canonical main self-SBOM delivery" >&2
            exit 1
          fi
          # The workflow run counter orders snapshots built from the same source.
          python3 tools/self-sbom-lifecycle.py deliver-main --rio "$RUNNER_TEMP/rio-stable/bin/rio" \
            --prepared "$RUNNER_TEMP/rio-self-sbom" --target-config tools/self-sbom-targets.json \
            --source-revision "$SOURCE_SHA" --repo "$GITHUB_REPOSITORY" --run-number "$GITHUB_RUN_NUMBER"
      - name: Retain main delivery evidence
        if: always() && needs.self-sbom.result == 'success' && needs.self-sbom.outputs.publish-main == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: main-self-sbom-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rio-self-sbom/
          include-hidden-files: true
          if-no-files-found: warn

  delivery-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # Python 3.9 is not available on ubuntu-latest (26.04); keep the job name, pin the runner.
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-24.04' || matrix.os }}
    timeout-minutes: 20
    steps:
      # Golden files and raw-byte fixture digests require an unchanged LF checkout.
      - name: Preserve fixture bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.9"
      - name: Native delivery and evidence tests
        run: go test ./internal/delivery/... ./internal/receipt/... ./internal/manifest ./internal/index ./internal/cli ./cmd/rio
      - name: Static build and installed-binary demo
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          go env GOOS GOARCH
          go build -trimpath -o rio-demo.exe ./cmd/rio
          python tools/demo-delivery/run.py "$PWD/rio-demo.exe"
          python tools/demo-delivery/project-fields.py "$PWD/rio-demo.exe"
          python tools/demo-use-case/run.py "$PWD/rio-demo.exe"
          python tools/demo-dtrack-tls/run.py "$PWD/rio-demo.exe"
          python tools/demo-normalization-evidence/run.py "$PWD/rio-demo.exe"
          python tools/demo-recovery/run.py "$PWD/rio-demo.exe"
          python tools/demo-client-record/run.py "$PWD/rio-demo.exe"
          python tools/demo-handoff-checks/run.py "$PWD/rio-demo.exe"
          python tools/demo-oci/run.py "$PWD/rio-demo.exe"


  oci-distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.9"
      - name: Create disposable TLS and Basic-auth fixtures
        run: python tools/demo-oci/integration/setup.py "$RUNNER_TEMP/rio-oci"
      - name: Start pinned real Distribution and zot
        env:
          RIO_OCI_FIXTURE_ROOT: ${{ runner.temp }}/rio-oci
        run: docker compose -p rio-oci-ci -f tools/demo-oci/integration/compose.yaml --profile zot up -d
      - name: Real Distribution TLS/auth, read-back, required-API refusal and recovery
        env:
          RIO_OCI_FIXTURE_ROOT: ${{ runner.temp }}/rio-oci
          RIO_OCI_TEST_EVIDENCE: ${{ runner.temp }}/rio-oci-distribution-evidence.json
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$RUNNER_TEMP/rio-oci/test.env"
          set +a
          docker compose -p rio-oci-ci -f tools/demo-oci/integration/compose.yaml exec -T distribution /bin/registry --version
          go test ./internal/delivery/oci -list '^TestIntegrationOCI$' | grep -x TestIntegrationOCI
          go test ./internal/delivery/oci -run '^TestIntegrationOCI$' -count=1 -v
      - name: Real zot TLS/auth, positive Referrers and crash recovery
        env:
          RIO_OCI_FIXTURE_ROOT: ${{ runner.temp }}/rio-oci
          RIO_OCI_TEST_EVIDENCE: ${{ runner.temp }}/rio-oci-zot-evidence.json
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$RUNNER_TEMP/rio-oci/test.env"
          set +a
          export RIO_OCI_TEST_REGISTRY=127.0.0.1:15001
          export RIO_OCI_TEST_PRODUCT=zot
          export RIO_OCI_TEST_VERSION=2.1.21
          export RIO_OCI_TEST_IMAGE_DIGEST=sha256:8258443838e95989c13c891f78a02bc1c391b5a00591ffef24cb8c17cde28038
          export RIO_OCI_TEST_REFERRERS=required
          docker compose -p rio-oci-ci -f tools/demo-oci/integration/compose.yaml exec -T zot /usr/local/bin/zot-linux-amd64 --version
          go test ./internal/delivery/oci -run '^TestIntegrationOCI$' -count=1 -v
      - name: Retain sanitized real-registry observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oci-registry-evidence
          path: ${{ runner.temp }}/rio-oci-*-evidence.json
          if-no-files-found: warn
      - name: Remove only this job's disposable registry and volume
        if: always()
        env:
          RIO_OCI_FIXTURE_ROOT: ${{ runner.temp }}/rio-oci
        run: docker compose -p rio-oci-ci -f tools/demo-oci/integration/compose.yaml --profile zot down -v


  dependency-track:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.9"
      - name: Create and start only this job's disposable receiver
        shell: bash
        run: |
          set -euo pipefail
          python tools/demo-delivery/integration/setup.py create "$RUNNER_TEMP/rio-dtrack"
          python tools/demo-delivery/integration/setup.py start "$RUNNER_TEMP/rio-dtrack"
      - name: Real adapter contracts and installed-binary client handoff
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/rio-integration" ./cmd/rio
          python tools/demo-delivery/integration/exercise.py "$RUNNER_TEMP/rio-dtrack" "$RUNNER_TEMP/rio-integration" --adapter-tests
      - name: Dependency-Track 5.2.1 project fields, subject links and adapter contracts
        shell: bash
        run: |
          set -euo pipefail
          python tools/demo-delivery/integration/setup.py create --server-version 5.2.1 "$RUNNER_TEMP/rio-dtrack-521"
          python tools/demo-delivery/integration/setup.py start "$RUNNER_TEMP/rio-dtrack-521"
          python tools/demo-delivery/integration/project_fields.py "$RUNNER_TEMP/rio-dtrack-521" "$RUNNER_TEMP/rio-integration" \
            --evidence "$RUNNER_TEMP/rio-dtrack-521/project-fields-evidence.json"
          # The full harness last: it stops the fixture when it finishes.
          python tools/demo-delivery/integration/exercise.py "$RUNNER_TEMP/rio-dtrack-521" "$RUNNER_TEMP/rio-integration" --adapter-tests
      - name: Retain only sanitized real-server evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-track-evidence
          path: |
            ${{ runner.temp }}/rio-dtrack-521/project-fields-evidence.json
            ${{ runner.temp }}/rio-dtrack-521/exercise-*/verification.json
            ${{ runner.temp }}/rio-dtrack-521/exercise-*/adapter-*-observations.json
            ${{ runner.temp }}/rio-dtrack-521/exercise-*/adapter-*.log
            ${{ runner.temp }}/rio-dtrack/exercise-*/verification.json
            ${{ runner.temp }}/rio-dtrack/exercise-*/adapter-*-observations.json
            ${{ runner.temp }}/rio-dtrack/exercise-*/adapter-*.log
            ${{ runner.temp }}/rio-dtrack/exercise-*/record-*.json
            ${{ runner.temp }}/rio-dtrack/exercise-*/report.html
          if-no-files-found: warn
      - name: Remove only this job's owned containers and volumes
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/rio-dtrack/state.json" ]; then
            python tools/demo-delivery/integration/setup.py stop "$RUNNER_TEMP/rio-dtrack"
          fi
          if [ -f "$RUNNER_TEMP/rio-dtrack-521/state.json" ]; then
            python tools/demo-delivery/integration/setup.py stop "$RUNNER_TEMP/rio-dtrack-521"
          fi

  complete:
    name: CI complete
    if: always()
    needs: [build, delivery-platforms, oci-distribution, dependency-track, self-sbom, publish-main-sbom]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every validation job
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        shell: bash
        run: |
          jq -e '
            (keys == ["build", "delivery-platforms", "dependency-track", "oci-distribution", "publish-main-sbom", "self-sbom"]) and
            (."self-sbom".outputs."publish-main" as $publish
              | ($publish == "true" or $publish == "false")
              and all(to_entries[] | select(.key != "publish-main-sbom"); .value.result == "success")
              and (."publish-main-sbom".result == "success"
                or ($publish == "false" and ."publish-main-sbom".result == "skipped")))
          ' <<<"$NEEDS_JSON"
