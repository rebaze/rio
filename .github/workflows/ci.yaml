name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Detect changed file types
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            git cat-file -e "$BASE" 2>/dev/null || git fetch --no-tags --depth=1 origin "$BASE"
            CHANGED=$(git diff --name-only "$BASE...HEAD")
          else
            BASE="${{ github.event.before }}"
            if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE" 2>/dev/null; then
              CHANGED=$(git diff --name-only "$BASE" HEAD)
            else
              CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git ls-files)
            fi
          fi
          echo "Changed files:"
          echo "$CHANGED"
          go=false
          goreleaser=false
          shell=false
          # Fixtures, golden files and the embedded CycloneDX schemas are
          # inputs to the test suite, so a change to any of them has to run it.
          # Missing that is how a stale golden file reaches main.
          if grep -E '(\.go$|^go\.(mod|sum)$|(^|/)testdata/|^internal/sbom/schemas/|^Makefile$)' <<<"$CHANGED" >/dev/null; then go=true; fi
          if grep -E '^\.goreleaser\.yaml$' <<<"$CHANGED" >/dev/null; then goreleaser=true; fi
          if grep -E '\.sh$' <<<"$CHANGED" >/dev/null; then shell=true; fi
          if grep -E '^\.github/workflows/ci\.yaml$' <<<"$CHANGED" >/dev/null; then go=true; goreleaser=true; shell=true; fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "goreleaser=$goreleaser" >> "$GITHUB_OUTPUT"
          echo "shell=$shell" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.changes.outputs.go == 'true' || steps.changes.outputs.goreleaser == 'true'
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Check formatting
        if: steps.changes.outputs.go == 'true'
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:" >&2
            echo "$unformatted" >&2
            gofmt -d $unformatted >&2
            exit 1
          fi

      # go.mod carried six direct dependencies marked // indirect, which nothing
      # caught because CI never ran tidy. The dependency list is a review
      # surface here: §8 fixes the shipped set at six and says a seventh needs
      # justification in the PR, so it has to stay honest.
      - name: Check go.mod is tidy
        if: steps.changes.outputs.go == 'true'
        run: go mod tidy -diff

      - name: Build
        if: steps.changes.outputs.go == 'true'
        run: go build ./...

      - name: Vet
        if: steps.changes.outputs.go == 'true'
        run: go vet ./...

      - name: Test
        if: steps.changes.outputs.go == 'true'
        run: go test -race ./...

      # rio must stay a self-contained static binary with no runtime
      # dependency on external tools, and it must make no network calls
      # (§8, and the "no network access anywhere in the binary" acceptance
      # criterion). Building with CGO off is the part CI can enforce.
      - name: Build the release binary the way GoReleaser does
        if: steps.changes.outputs.go == 'true'
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          go build -trimpath -o rio ./cmd/rio
          ./rio version
          ./rio normalize --help > /dev/null

      - name: Lint shell scripts
        if: steps.changes.outputs.shell == 'true'
        run: |
          set -euo pipefail
          # Preinstalled on the GitHub-hosted ubuntu images; installed here so
          # the job also runs on a bare container or under act.
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fi
          shellcheck --version
          shellcheck -s sh install.sh
          shellcheck tools/rio-dtrack-upload.sh install_test.sh tools/rio-dtrack-upload_test.sh

      - name: Test the shell scripts offline
        if: steps.changes.outputs.shell == 'true'
        run: |
          set -euo pipefail
          ./install_test.sh
          ./tools/rio-dtrack-upload_test.sh

      - name: Install GoReleaser
        if: steps.changes.outputs.goreleaser == 'true'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          install-only: true

      - name: Validate GoReleaser config
        if: steps.changes.outputs.goreleaser == 'true'
        run: goreleaser check
