services:
  distribution:
    image: distribution/distribution:3.1.2@sha256:d106962e6fe3fa69c178cec77eeeee5edb626b8df6535b7bd6b95e658a0a5ca9
    ports:
      - "127.0.0.1:${RIO_OCI_BIND_PORT:-15000}:5000"
    environment:
      REGISTRY_HTTP_ADDR: "0.0.0.0:5000"
      REGISTRY_HTTP_TLS_CERTIFICATE: /tls/cert.pem
      REGISTRY_HTTP_TLS_KEY: /tls/key.pem
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: rio-disposable
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      OTEL_TRACES_EXPORTER: none
    volumes:
      - "${RIO_OCI_FIXTURE_ROOT:?set an isolated fixture root}/tls:/tls:ro"
      - "${RIO_OCI_FIXTURE_ROOT:?set an isolated fixture root}/auth:/auth:ro"
      - data:/var/lib/registry
    labels:
      io.rebaze.rio.disposable: rio-83-oci
  zot:
    profiles: [zot]
    image: ghcr.io/project-zot/zot-linux-${RIO_OCI_ZOT_ARCH:-amd64}:v2.1.21@${RIO_OCI_ZOT_DIGEST:-sha256:8258443838e95989c13c891f78a02bc1c391b5a00591ffef24cb8c17cde28038}
    user: "0:0"
    command: [serve, /etc/zot/config.json]
    ports:
      - "127.0.0.1:${RIO_OCI_ZOT_PORT:-15001}:5000"
    volumes:
      - "./zot.json:/etc/zot/config.json:ro"
      - "${RIO_OCI_FIXTURE_ROOT:?set an isolated fixture root}/tls:/tls:ro"
      - "${RIO_OCI_FIXTURE_ROOT:?set an isolated fixture root}/auth:/auth:ro"
      - zot-data:/var/lib/zot
    labels:
      io.rebaze.rio.disposable: rio-83-oci
volumes:
  data:
    labels:
      io.rebaze.rio.disposable: rio-83-oci
  zot-data:
    labels:
      io.rebaze.rio.disposable: rio-83-oci
