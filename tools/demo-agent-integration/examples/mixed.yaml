version: 1
artifacts:
  # Existing release identity: preserve this override when adding servers.
  - id: desktop
    sbom: desktop/target/bom.json
    subject: {name: shipping-desktop, version: "3.2.0"}
    transforms:
      - repair-purl: {ecosystem: p2, table: config/p2-maven.json}
  - id: legacy-server
    sbom: services/Legacy-server/target/bom.json
artifactSets:
  - modules: "services/*server/pom.xml"
    sbom: "target/bom.json"
    idFrom: module-directory
    exclude: ["services/Legacy-server/pom.xml"]
output:
  specVersionFloor: "1.5"
gate:
  require: [name, version]
