version: 1
artifacts:
  - id: console
    sbom: inputs/console.cdx.json
    enrichment:
      subject: {version: "1.0.0", purl: "pkg:maven/org.example/console@1.0.0"}
    context:
      file: context.json
      require: [source.repository, source.revision, build.url]
  - id: agent
    sbom: inputs/agent.cdx.json
    enrichment:
      subject: {version: "1.0.0", purl: "pkg:maven/org.example/agent@1.0.0"}
    context:
      file: context.json
      require: [source.repository, build.url]
output:
  specVersionFloor: "1.6"
gate:
  require: [name, version, purl]
