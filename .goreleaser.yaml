version: 2

project_name: rio

builds:
  - main: ./cmd/rio
    binary: rio
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/rebaze/rio/internal/cli.version={{.Version}}
      - -X github.com/rebaze/rio/internal/cli.commit={{.Commit}}
      - -X github.com/rebaze/rio/internal/cli.date={{.Date}}

# Developer ID signing and notarization of the darwin binaries, done on Linux
# through quill before archiving, so the archives and checksums carry the
# signed bytes. Enabled only when the credentials are present: local snapshots
# stay unsigned, and the release workflow refuses to run without them.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      # Every change lands through a PR, so the merge commit says nothing the
      # commit it merges does not already say. Without this the notes are
      # roughly half "Merge pull request #NN from rebaze/...".
      - "^Merge pull request"

homebrew_casks:
  - repository:
      owner: rebaze
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/rebaze/rio
    description: The rio CLI
    license: Apache-2.0
    binaries:
      - rio
    dependencies: []
